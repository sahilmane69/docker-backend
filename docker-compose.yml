version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: node-api

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    volumes:
      - redis-data:/data

volumes:
  redis-data: